<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: rgb(233, 255, 255);

        }

        .container {
            width: 100%;
            min-height: 100vh;
        }

        header {
            width: 100%;
            height: 50px;
            border: 1px solid rgb(66, 167, 255);
            text-align: center;
            font-size: 32px;
            background: linear-gradient(to top,rgb(66, 167, 255),rgb(186, 223, 255));
        }

        .hori {
            width: 100%;
            height: 45px;
            font-size: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(to top,rgb(186, 223, 255),rgb(66, 167, 255));
            border-bottom: 1px solid black;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .content {
            display: flex;
            width: 100%;
            height: 85vh;
        }

        aside {
            width: 30px;
            height: 100%;
            flex-shrink: 0;
            transition: width 1s linear, font-size 1s linear;

        }

        .ver {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 55px;
            align-items: center;
            text-align: center;
            background-color: rgb(197, 223, 245);
            font-size: 5px;
            overflow: hidden;
            border-right: 1px solid black;
            transition: width 1s linear, font-size 1s linear;
        }


        .ver:hover {
            width: 200px;
            font-size: 30px;
        }
        aside:hover{
            width: 200px;
        }

        main {
            flex: 1;
            padding: 20px;
        }
        footer {
            width: 100%;
            height: 50px;
            border-top: 1px solid black;
            text-align: center;
            font-size: 32px;
            background: linear-gradient(to top, rgb(66, 167, 255),rgb(186, 223, 255));
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            Image Gallery
        </header>

        <nav class="hori">
            <a href="index.html">Home</a>
            <a href="image.html">Gallery</a>
        </nav>

        <div class="content">

            <aside>
                <nav class="ver">
                    <a href="index.html">Home</a>
                    <a href="image.html">Gallery</a>
                </nav>
            </aside>

            <main>
                <h1>
                    About Image Gallary
                </h1>
            </main>

        </div>

        <footer>
            Image Gallery
        </footer>

    </div>

</body>

</html>
