<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
<style>
    * {
        padding: 0;
        margin: 0;
        font-family: 'Times New Roman', Times, serif;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background-color: rgb(233, 255, 255);
    }

    .container {
        width: 100%;
        min-height: 100vh;
    }

    header {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgb(66, 167, 255);
        text-align: center;
        font-size: 32px;
        padding: 5px;
        background: linear-gradient(
            to top,
            rgb(66, 167, 255),
            rgb(186, 223, 255)
        );
    }

    .hori {
        width: 100%;
        min-height: 45px;
        font-size: 28px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: linear-gradient(
            to top,
            rgb(186, 223, 255),
            rgb(66, 167, 255)
        );
        border-bottom: 1px solid black;
    }

    a {
        text-decoration: none;
        color: black;
    }

    .content {
        display: flex;
        width: 100%;
        min-height: 75vh;
    }

    /* Vertical navigation */
    aside {
        width: 30px;
        flex-shrink: 0;
        transition: width 1s linear;
    }

    .ver {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 55px;
        align-items: center;
        text-align: center;
        background-color: rgb(197, 223, 245);
        font-size: 5px;
        overflow: hidden;
        border-right: 1px solid black;
        padding-top: 20px;
        transition: width 1s linear, font-size 1s linear;
    }

    aside:hover {
        width: 200px;
    }

    .ver:hover {
        width: 200px;
        font-size: 30px;
    }

    main {
        flex: 1;
        padding: 30px;
    }

    main h1 {
        margin-bottom: 20px;
    }

    .contact {
        margin-top: 30px;
        font-size: 20px;
    }

    footer {
        width: 100%;
        min-height: 50px;
        border-top: 1px solid black;
        text-align: center;
        font-size: 32px;
        padding: 5px;
        background: linear-gradient(
            to top,
            rgb(66, 167, 255),
            rgb(186, 223, 255)
        );
    }


    @media (min-width: 768px) and (max-width: 991px) {

        header {
            font-size: 28px;
        }

        .hori {
            font-size: 24px;
        }

        aside {
            width: 40px;
        }

        .ver {
            font-size: 7px;
        }

        aside:hover,
        .ver:hover {
            width: 160px;
        }

        main {
            padding: 20px;
        }

        main h1 {
            font-size: 28px;
        }
    }


    @media (max-width: 767px) {

        header {
            font-size: 24px;
        }

        .hori {
            font-size: 20px;
            min-height: 40px;
        }

        .content {
            flex-direction: column;
        }

        aside {
            width: 100%;
            height: auto;
        }

        .ver {
            width: 100%;
            height: auto;
            min-height: 50px;
            flex-direction: row;
            justify-content: space-around;
            gap: 10px;
            padding: 12px;
            font-size: 20px;
            border-right: none;
            border-bottom: 1px solid black;
        }

        aside:hover {
            width: 100%;
        }

        .ver:hover {
            width: 100%;
            font-size: 20px;
        }

        main {
            padding: 20px 15px;
            min-height: 55vh;
        }

        main h1 {
            font-size: 24px;
        }

        .contact {
            font-size: 18px;
        }

        footer {
            font-size: 24px;
        }
    }

    @media (max-width: 400px) {

        header {
            font-size: 21px;
        }

        .hori {
            font-size: 18px;
        }

        .ver {
            font-size: 18px;
        }

        .ver:hover {
            font-size: 18px;
        }

        main h1 {
            font-size: 21px;
        }

        footer {
            font-size: 20px;
        }
    }
</style>

</head>

<body>
   <div class="container">

    <header>
        Image Gallery
    </header>

    <!-- Horizontal Navigation -->
    <nav class="hori">
        <a href="index.html">Home</a>
        <a href="image.html">Gallery</a>
    </nav>

    <div class="content">

        <!-- Vertical Navigation -->
        <aside>
            <nav class="ver">
                <a href="index.html">Home</a>
                <a href="image.html">Gallery</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <h1>About Image Gallery</h1>

            <p>
                Welcome to our Photo Magazine website.
                Explore beautiful photographs in our gallery.
            </p>

            <!-- Contact Details -->
            <div class="contact">
                <h2>Contact Details</h2>
                <p>Email: example@gmail.com</p>
                <p>Phone: +91 9876543210</p>
                <p>Address: Karnataka, India</p>
            </div>

        </main>

    </div>

    <footer>
        Image Gallery
    </footer>

</div>


</body>

</html>
