<!DOCTYPE html>
<html>
<head>
    <title>Transition and Animation</title>

    <style>
        /* TRANSITION */
        .box {
            width: 100px;
            height: 100px;
            background-color: blue;

            /* Smoothly changes the properties */
            transition: 0.5s;
        }

        .box:hover {
            width: 200px;
            background-color: red;
        }


        /* ANIMATION */
        .circle {
            width: 100px;
            height: 100px;
            background-color: green;
            
            animation-direction: reverse;
            animation: move 5s infinite;
        }

        @keyframes move {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(200px);
                border-radius: 50%;
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <h2>CSS Transition</h2>
    <div class="box"></div>

    <h2>CSS Animation</h2>
    <div class="circle"></div>

</body>
</html>
