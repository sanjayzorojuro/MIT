<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators</title>
    <style>
        .div1 p{
            color: yellow;

        }
        .div2 + p{
            color: red;
        }
        .div3 > p{
            color: green;

        }
        .div4~p{
            color: blue;
        }
    </style>
</head>
<body>
    <div>
        <div class="div1">
            <p>para 1</p>
            <p>para 2</p>
            <span>
                <p>para 3</p>
            </span>
        </div>
        <p>para 4</p>
        <p>para 5</p>
    </div>
</body>
</html>
